<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance System</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root { --primary:#2563eb; --primary-dark:#1d4ed8; --bg:#f4f6f9; --card:#fff; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; }
  .logo { position:fixed; top:16px; left:16px; width:44px; height:44px; object-fit:contain; }
  h1 { font-size:1.6rem; margin-bottom:4px; }
  .subtitle { color:var(--muted); font-size:0.95rem; margin-bottom:32px; text-align:center; }
  .links { display:flex; flex-direction:column; gap:14px; width:100%; max-width:340px; }
  a.link-card { display:block; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; text-decoration:none; color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,0.05); }
  a.link-card:hover { border-color:var(--primary); }
  a.link-card .title { font-weight:700; font-size:1.05rem; color:var(--primary-dark); }
  a.link-card .desc { font-size:0.85rem; color:var(--muted); margin-top:2px; }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Attendance System logo">
  <h1 style="margin-top:8px;">Attendance System</h1>
  <div class="subtitle">Choose where you need to go.</div>
  <div class="links">
    <a class="link-card" href="register.html">
      <div class="title">Register Your Company</div>
      <div class="desc">New company or organization? Create an account here.</div>
    </a>
    <a class="link-card" href="dashboard.html">
      <div class="title">Company Dashboard</div>
      <div class="desc">Already registered? Log in to add and manage employees.</div>
    </a>
    <a class="link-card" href="attendance.html">
      <div class="title">Employee Attendance</div>
      <div class="desc">Employees: check in or out with your ID and password.</div>
    </a>
  </div>
</body>
</html>
